<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>#Kaamboltahai | PDA 🚲 | MISSION 2027</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top left, rgba(255, 0, 0, 0.35), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 255, 100, 0.30), transparent 35%),
        linear-gradient(135deg, #050505, #101010, #050505);
      padding-bottom: 40px;
    }

    .topbar {
      width: 100%;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .mission {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ddd;
    }

    .hero {
      text-align: center;
      padding: 55px 20px 30px;
    }

    .cycle {
      font-size: 58px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 75px);
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow:
        0 0 10px rgba(255,0,0,0.8),
        0 0 25px rgba(0,255,100,0.5);
    }

    .hashtag {
      margin-top: 15px;
      font-size: clamp(22px, 5vw, 38px);
      font-weight: 800;
      color: white;
    }

    .player-card {
      width: min(92%, 650px);
      margin: 25px auto;
      padding: 25px;
      border-radius: 24px;
      background: rgba(20,20,20,0.75);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow:
        0 0 30px rgba(255,0,0,0.12),
        0 0 30px rgba(0,255,100,0.10);
      backdrop-filter: blur(15px);
    }

    .player-title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      transition: 0.2s;
      text-align: left;
      font-size: 15px;
    }

    .song:hover {
      background: rgba(255,255,255,0.13);
      transform: translateY(-1px);
    }

    .song.active {
      border-color: rgba(0,255,100,0.6);
      background: rgba(0,255,100,0.10);
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }

    .now-playing {
      text-align: center;
      margin-top: 15px;
      color: #ccc;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #aaa;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 15px;
      }

      .logo {
        font-size: 20px;
      }

      .mission {
        font-size: 11px;
      }

      .hero {
        padding-top: 40px;
      }

      .cycle {
        font-size: 48px;
      }

      .player-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="logo">PDA 🚲</div>
    <div class="mission">MISSION 2027</div>
  </div>

  <section class="hero">

    <div class="cycle">🚲</div>

    <h1>#Kaamboltahai</h1>

    <div class="hashtag">#Kaamboltahai</div>

  </section>

  <div class="player-card">

    <div class="player-title">
      #Kaamboltahai
    </div>

    <div class="song-list" id="songList"></div>

    <audio id="audioPlayer" controls preload="metadata"></audio>

    <div class="now-playing" id="nowPlaying">
      कोई गाना चुनें
    </div>

  </div>

  <div class="footer">
    © 2026 #Kaamboltahai
  </div>


  <script>
    const songs = [
      "mp3/song1.mp3",
      "mp3/song2.mp3",
      "mp3/song3.mp3",
      "mp3/song4.mp3",
      "mp3/song5.mp3",
      "mp3/song6.mp3",
      "mp3/song7.mp3",
      "mp3/song8.mp3"
    ];

    const songList = document.getElementById("songList");
    const audioPlayer = document.getElementById("audioPlayer");
    const nowPlaying = document.getElementById("nowPlaying");

    songs.forEach((file, index) => {

      const button = document.createElement("button");

      button.className = "song";

      button.textContent = "🎵 " + file
        .replace("mp3/", "")
        .replace(".mp3", "");

      button.addEventListener("click", () => {

        document.querySelectorAll(".song")
          .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        audioPlayer.src = file;
        audioPlayer.load();
        audioPlayer.play();

        nowPlaying.textContent =
          "▶️ " + file
            .replace("mp3/", "")
            .replace(".mp3", "");

      });

      songList.appendChild(button);
    });
  </script>

</body>
</html>
