<script>

const songs = [
  {
    file: "Akhilesh%20Yadav's%20campaign%20video-%20Kaam%20Bolta%20Hai%20-%20Dimple%20Yadav%20(128k).mp3",
    name: "Akhilesh Yadav - Kaam Bolta Hai"
  },
  {
    file: "Cycle%20Chalegi%20Up%20Mai%20Gagan%20Fouji%20New%20Samajwadi%20Song%20Mission%202027%20%23akhileshyadavsong%20-%20BAJWA%20MUSIC%20(128k).mp3",
    name: "Cycle Chalegi UP Mein"
  },
  {
    file: "Mein%20Akhilesh%20Ka%20Fan%20Hu%20Song%20Kalu%20Yadav%20Sorkha%20Samajwadi%20Party%20Akhilesh%20Yadav%20Song%20Yadav%20Song%20-%20Risky%20Music%20(128k).mp3",
    name: "Mein Akhilesh Ka Fan Hu"
  },
  {
    file: "PDA%20Ke%20Mahanayak%20Kalu%20Yadav%20Sorkha%20Akhilesh%20Wazidpuria%20Samajwadi%20Party%20Song%202027%20-%20Kalu%20Yadav%20Sorkha%20(128k).mp3",
    name: "PDA Ke Mahanayak"
  },
  {
    file: "Samajwadi%20Party%20ThemeSong%20Akhilesh%20Yadav%20Mulayam%20Singh%20Yadav%20Samajwadi%20Party%20Support%20Samajwad%20-%20Support%20Samajwad%20(128k).mp3",
    name: "Samajwadi Party Theme Song"
  },
  {
    file: "Samajwadi%20Prahari%20-%20Janta%20Pukarti%20Hai%20Akhilesh%20Aaiye%20-%20SamajwadiPrahariVEVO%20(128k).mp3",
    name: "Samajwadi Prahari"
  },
  {
    file: "Up%20Me%20Cycle%20Hi%20Chalegi%20_Risky%20Yadav%20Akhilesh%20Yadav%20Song%202027%20Samajwadi%20Party%20Kalu%20Yadav%20Sorkha%20-%20Risky%20Music%20(128k).mp3",
    name: "UP Me Cycle Hi Chalegi"
  },
  {
    file: "VIDEO%20-%20%E0%A4%B8%E0%A4%AA%E0%A4%BE%20%E0%A4%86%E0%A4%88%20%E0%A4%B0%E0%A5%87%20-%20Samar%20Singh%20-%20Sapa%20Aai%20Re%20-%20Akhilesh%20Yadav%20-%20Samajwadi%20Party%20Song%202022%20-%20Samar%20Singh%20Official%20(128k).mp3",
    name: "Sapa Aai Re - Samar Singh"
  }
];

let currentSong = 0;

const audio = document.getElementById("audioPlayer");
const title = document.getElementById("songTitle");
const number = document.getElementById("songNumber");
const counter = document.getElementById("counter");
const playButton = document.getElementById("playButton");
const error = document.getElementById("error");

function loadSong(index) {

  currentSong = index;

  title.textContent = songs[index].name;
  number.textContent = "Song " + (index + 1);
  counter.textContent = (index + 1) + " / " + songs.length;

  /*
    तुम्हारी GitHub file में %20 literally filename का हिस्सा है।
    इसलिए encodeURIComponent() उसे %2520 में बदलेगा।
  */
  audio.src = encodeURIComponent(songs[index].file);

  audio.load();

  error.style.display = "none";
  playButton.textContent = "▶";
}

function togglePlay() {

  if (audio.paused) {

    audio.play()
      .then(() => {
        playButton.textContent = "❚❚";
      })
      .catch(() => {
        error.style.display = "block";
      });

  } else {

    audio.pause();
    playButton.textContent = "▶";

  }
}

function nextSong() {

  currentSong++;

  if (currentSong >= songs.length) {
    currentSong = 0;
  }

  loadSong(currentSong);

  audio.play()
    .then(() => {
      playButton.textContent = "❚❚";
    })
    .catch(() => {
      error.style.display = "block";
    });
}

function previousSong() {

  currentSong--;

  if (currentSong < 0) {
    currentSong = songs.length - 1;
  }

  loadSong(currentSong);

  audio.play()
    .then(() => {
      playButton.textContent = "❚❚";
    })
    .catch(() => {
      error.style.display = "block";
    });
}

audio.addEventListener("ended", nextSong);

audio.addEventListener("error", function() {
  error.style.display = "block";
});

audio.addEventListener("play", function() {
  playButton.textContent = "❚❚";
});

audio.addEventListener("pause", function() {
  playButton.textContent = "▶";
});

loadSong(0);


/* ऊपर वाला information text */

const works = [
  "1090 महिला शक्ति लाइन — महिलाओं की सुरक्षा से जुड़ी हेल्पलाइन",
  "लखनऊ मेट्रो — शहरी परिवहन परियोजना",
  "आगरा-लखनऊ एक्सप्रेसवे — 302 किलोमीटर का एक्सप्रेसवे",
  "किसान बाज़ार — किसानों से जुड़ी बाजार व्यवस्था",
  "लोहिया आवास योजना — ग्रामीण आवास से जुड़ी योजना",
  "108 आपातकालीन एम्बुलेंस सेवा — स्वास्थ्य सेवा"
];

let currentWork = 0;

setInterval(function() {

  const text = document.getElementById("workText");

  text.style.opacity = "0";

  setTimeout(function() {

    currentWork = (currentWork + 1) % works.length;

    text.textContent = works[currentWork];

    text.style.opacity = "1";

  }, 400);

}, 3500);

</script>
